<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ModFinder</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root,[data-theme=dark]{--bg:#0d0f14;--bg2:#161a22;--bg3:#202634;--tx:#eef1f6;--hint:#8a93a6;--acc:#1bd96a;--acctx:#06210f;--line:#ffffff14;--mr:#1bd96a;--cf:#f16436}
[data-theme=light]{--bg:#f4f6fa;--bg2:#ffffff;--bg3:#e8ecf3;--tx:#12151c;--hint:#687286;--acc:#12a150;--acctx:#ffffff;--line:#0000001a;--mr:#12a150;--cf:#e0551f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:40px;transition:background .2s,color .2s}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#1bd96a,#2ea6ff);display:grid;place-items:center;font-size:20px}
.top b{font-size:19px;flex:1}
.ibtn{background:var(--bg2);border:1px solid var(--line);border-radius:12px;height:36px;min-width:36px;padding:0 10px;font-size:14px;font-weight:600}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.search button{background:var(--acc);color:var(--acctx);border:0;border-radius:14px;padding:0 16px;font-size:18px}
.search .ai{background:var(--bg2);border:1px solid var(--line);padding:0 13px}
.aibox{max-height:0;overflow:hidden;transition:max-height .25s ease}
.aibox.open{max-height:60vh;overflow-y:auto;margin-top:10px}
.aibox textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;outline:none;resize:none;margin-bottom:8px}
.aibox textarea:focus{border-color:var(--acc)}
.aichips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip .ar{display:inline-block;margin-left:4px;transition:transform .2s;font-size:10px}
.chip.open .ar{transform:rotate(180deg)}
.pick .chip{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;padding:8px 8px;font-size:12.5px}
.pick .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel{max-height:0;overflow:hidden;transition:max-height .25s ease}
#panel.open{max-height:50vh}
.plist{margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-height:calc(50vh - 12px);overflow-y:auto}
.pitem{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.pitem:last-child{border-bottom:0}
.pitem.on{color:var(--acc);font-weight:600}
.pitem.on:after{content:"✓"}
main{padding:12px 14px}
.sec{font-size:17px;font-weight:700;margin:6px 2px 10px}
.info{color:var(--hint);font-size:13px;margin:4px 2px 10px}
.marquee{overflow:hidden;margin:0 -14px 10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:10px;width:max-content;padding:2px 14px;animation:mq 70s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:85s}
.marquee:active .track,.marquee:hover .track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;width:210px;cursor:pointer}
.mq img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--bg3);flex:none}
.mq div{min-width:0}.mq b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mq span{font-size:11px;color:var(--hint)}
.card{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.98)}
.ico{width:56px;height:56px;border-radius:13px;background:var(--bg3);flex:none;object-fit:cover}
.meta{min-width:0;flex:1}
.t{font-weight:600;display:flex;align-items:center;gap:6px}
.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;flex:none}
.badge.mr{background:color-mix(in srgb,var(--mr) 18%,transparent);color:var(--mr)}
.badge.cf{background:color-mix(in srgb,var(--cf) 18%,transparent);color:var(--cf)}
.a{color:var(--hint);font-size:12px;margin:2px 0 4px}
.d{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.9}
.skel{height:80px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--hint);padding:50px 10px}.empty div{font-size:44px;margin-bottom:8px}
#detail{display:none;padding:14px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero .ico{width:76px;height:76px;border-radius:18px}
.hero h2{font-size:21px;line-height:1.2}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;background:var(--acc);color:var(--acctx);margin-bottom:8px}
.btn.sec2{background:var(--bg2);color:var(--tx);border:1px solid var(--line)}
h3{font-size:16px;margin:18px 0 10px}
.file{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.file .fm{flex:1;min-width:0}.file .fn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fv{font-size:12px;color:var(--hint)}
.mini{border:0;border-radius:10px;padding:8px 10px;font-size:13px;background:var(--acc);color:var(--acctx);flex:none}
.mini.g{background:var(--bg3);color:var(--tx)}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.sim{flex:none;width:120px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.sim img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--bg3)}
.sim b{display:block;font-size:12px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sim span{font-size:11px;color:var(--hint)}
.body{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;overflow:hidden}
.body img{max-width:100%;height:auto;border-radius:10px}
.body a{color:var(--acc)}
.body.short{max-height:320px;position:relative}
.body.short:after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--bg2))}
.lb{position:fixed;inset:0;z-index:20;background:#000e;display:none;align-items:center;justify-content:center;padding:24px}
.lb.show{display:flex}
.lb img{max-width:100%;max-height:80vh;border-radius:20px;image-rendering:auto;box-shadow:0 10px 40px #0008}
.lb button{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:22px}
.hero .ico{cursor:zoom-in}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:transform .25s;z-index:10}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="list">
  <header>
    <div class="top"><div class="logo">🧩</div><b>ModFinder</b>
      <button class="ibtn" id="langBtn">EN</button><button class="ibtn" id="themeBtn">🌙</button></div>
    <form class="search" id="f"><input id="q" autocomplete="off"><button type="button" class="ai" id="aiBtn">✨</button><button>🔎</button></form>
    <div class="filters pick">
      <button class="chip" id="srcBtn"><span></span><i class="ar">▼</i></button>
      <button class="chip" id="verBtn"><span></span><i class="ar">▼</i></button>
      <button class="chip" id="ldrBtn"><span></span><i class="ar">▼</i></button>
    </div>
    <div id="panel"><div class="plist" id="plist"></div></div>
    <div id="aiBox" class="aibox"></div>
  </header>
  <main id="res"></main>
</div>
<div id="detail"></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img id="lbImg" alt=""><button id="lbX" aria-label="Close">✕</button></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzMP58flRxIlCkuCbl-JVIl0Pi-zdJkY9Z1dj-GSB-RUewTwXW-IjGQRhTMaBczumj1/exec';
const tg = window.Telegram ? Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const LS = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const SV = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const S = { src:'all', v:LS('v',''), l:LS('l',''), lang:LS('lang','en'), theme:LS('theme','dark'), versions:[], panel:null, trCache:{} };

const T = {
 en:{ph:'Search mods…',all:'All',allS:'All sites',anyV:'Any version',anyL:'All loaders',trending:'🔥 Trending now',popular:'⭐ Most popular',nothing:'Nothing found.<br>Try another query or version.',conn:'Connection error',as:'Searching for',
     dl:'📥 Download',dlFor:' for ',site:'🌐 Open website',files:'📦 Files',noFiles:'No files for this version / loader',similar:'🔎 Similar mods',noSim:'No similar mods found',desc:'📄 Description',more:'Show full',
     tr:'🌐 Translate description',chat:'To chat',sent:'File sent to the bot chat',fail:'Could not send — the bot sent a link',forb:'The author disabled direct downloads — open the website',failMod:'Could not load the mod',results:'Results',dls:'downloads',by:'by',orig:'📄 Show original',showTr:'🌐 Show translation',aiPh:'Describe the mod you want… e.g. “a mod with many kinds of sniffers”',aiGo:'✨ Get search ideas',aiAll:'🔎 Search all ideas',aiHint:'Tap an idea to search:',aiErr:'AI is busy right now, try again in a moment'},
 ru:{ph:'Поиск модов…',all:'Все',allS:'Все сайты',anyV:'Любая версия',anyL:'Все загрузчики',trending:'🔥 Сейчас в тренде',popular:'⭐ Самые популярные',nothing:'Ничего не найдено.<br>Попробуй другой запрос или версию.',conn:'Ошибка соединения',as:'Ищу как',
     dl:'📥 Скачать',dlFor:' для ',site:'🌐 Открыть сайт',files:'📦 Файлы',noFiles:'Нет файлов для этой версии / загрузчика',similar:'🔎 Похожие моды',noSim:'Похожих не нашлось',desc:'📄 Описание',more:'Показать полностью',
     tr:'🌐 Перевести описание',chat:'В чат',sent:'Файл отправлен в чат с ботом',fail:'Не вышло отправить — бот прислал ссылку',forb:'Автор запретил прямое скачивание — открой сайт',failMod:'Не удалось загрузить мод',results:'Результаты',dls:'скачиваний',by:'автор',orig:'📄 Показать оригинал',showTr:'🌐 Показать перевод',aiPh:'Опиши, какой мод ищешь… например «мод, где много разных нюхачей»',aiGo:'✨ Подобрать запросы',aiAll:'🔎 Искать по всем',aiHint:'Нажми на запрос, чтобы искать:',aiErr:'ИИ сейчас занят, попробуй ещё раз'},
 uk:{ph:'Пошук модів…',all:'Усі',allS:'Усі сайти',anyV:'Будь-яка версія',anyL:'Усі завантажувачі',trending:'🔥 Зараз у тренді',popular:'⭐ Найпопулярніші',nothing:'Нічого не знайдено.<br>Спробуй інший запит або версію.',conn:'Помилка зʼєднання',as:'Шукаю як',
     dl:'📥 Завантажити',dlFor:' для ',site:'🌐 Відкрити сайт',files:'📦 Файли',noFiles:'Немає файлів для цієї версії / завантажувача',similar:'🔎 Схожі моди',noSim:'Схожих не знайшлося',desc:'📄 Опис',more:'Показати повністю',
     tr:'🌐 Перекласти опис',chat:'У чат',sent:'Файл надіслано в чат з ботом',fail:'Не вдалося надіслати — бот надіслав посилання',forb:'Автор заборонив пряме завантаження — відкрий сайт',failMod:'Не вдалося завантажити мод',results:'Результати',dls:'завантажень',by:'автор',orig:'📄 Показати оригінал',showTr:'🌐 Показати переклад',aiPh:'Опиши, який мод шукаєш… наприклад «мод, де багато різних нюхачів»',aiGo:'✨ Підібрати запити',aiAll:'🔎 Шукати за всіма',aiHint:'Натисни на запит, щоб шукати:',aiErr:'ШІ зараз зайнятий, спробуй ще раз'}
};
const t = k => (T[S.lang] || T.en)[k];
const LANGS = [['en','English'],['ru','Русский'],['uk','Українська']];
const LOADERS = ['fabric','forge','neoforge','quilt'];
const LNAME = { fabric:'Fabric', forge:'Forge', neoforge:'NeoForge', quilt:'Quilt' };

const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : (n||0);
const badge = s => `<span class="badge ${s}">${s === 'mr' ? 'MODRINTH' : 'CURSEFORGE'}</span>`;
const haptic = () => tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light');
const openURL = u => tg ? tg.openLink(u) : window.open(u);
function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2400); }
async function api(p){ const r = await fetch(API + '?' + new URLSearchParams(p)); return r.json(); }

// ---------- translation of mod texts (when language is not English) ----------
async function translateTexts(arr){
  if (S.lang === 'en' || !arr.length) return arr;
  const need = arr.filter(x => x && !S.trCache[S.lang + x]);
  const parts = []; for (let k = 0; k < need.length; k += 10) parts.push(need.slice(k, k + 10));
  await Promise.all(parts.map(async part => {
    try {
      const r = await api({ a:'tr', to:S.lang, text: part.join('\n¶\n') });
      (r.text || '').split(/\n?¶\n?/).forEach((v, i) => { if (part[i]) S.trCache[S.lang + part[i]] = v.trim(); });
    } catch (e) {}
  }));
  return arr.map(x => S.trCache[S.lang + x] || x);
}
async function translateCards(root){
  if (S.lang === 'en') return;
  const els = [...root.querySelectorAll('.d[data-o]')];
  const out = await translateTexts(els.map(e => e.dataset.o));
  els.forEach((e, i) => e.textContent = out[i]);
}

// ---------- theme / language ----------
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  $('#themeBtn').textContent = S.theme === 'dark' ? '🌙' : '☀️';
  const bg = S.theme === 'dark' ? '#0d0f14' : '#f4f6fa';
  if (tg && tg.setHeaderColor) { try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {} }
}
function applyLang(){
  document.documentElement.lang = S.lang;
  $('#langBtn').textContent = S.lang.toUpperCase();
  $('#q').placeholder = t('ph');
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  $('#verBtn span').textContent = S.v || t('anyV');
  $('#verBtn').classList.toggle('on', !!S.v);
  $('#srcBtn span').textContent = S.src === 'mr' ? 'Modrinth' : S.src === 'cf' ? 'CurseForge' : t('allS');
  $('#srcBtn').classList.toggle('on', S.src !== 'all');
  $('#ldrBtn span').textContent = S.l ? LNAME[S.l] : t('anyL');
  $('#ldrBtn').classList.toggle('on', !!S.l);
}
$('#themeBtn').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; SV('theme', S.theme); haptic(); applyTheme(); };

// ---------- expandable column picker ----------
function openPanel(kind){
  const panel = $('#panel');
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('open'));
  if (S.panel === kind) { S.panel = null; panel.classList.remove('open'); return; }
  S.panel = kind; haptic();
  let items, cur;
  if (kind === 'v') { items = [['', t('anyV')]].concat(S.versions.map(v => [v, v])); cur = S.v; $('#verBtn').classList.add('open'); }
  else if (kind === 'src') { items = [['all', t('allS')], ['mr', 'Modrinth'], ['cf', 'CurseForge']]; cur = S.src; $('#srcBtn').classList.add('open'); }
  else if (kind === 'l') { items = [['', t('anyL')]].concat(LOADERS.map(l => [l, LNAME[l]])); cur = S.l; $('#ldrBtn').classList.add('open'); }
  else { items = LANGS; cur = S.lang; }
  $('#plist').innerHTML = items.map(([val, label]) => `<div class="pitem${val === cur ? ' on' : ''}" data-val="${esc(val)}">${esc(label)}</div>`).join('');
  $('#plist').scrollTop = 0;
  $('#plist').querySelectorAll('.pitem').forEach(el => el.onclick = () => pick(kind, el.dataset.val));
  panel.classList.add('open');
}
function pick(kind, val){
  haptic(); S.panel = null; $('#panel').classList.remove('open');
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('open'));
  if (kind === 'v') { S.v = val; SV('v', val); }
  else if (kind === 'src') { S.src = val; }
  else if (kind === 'l') { S.l = val; SV('l', val); }
  else { S.lang = val; SV('lang', val); }
  applyLang(); refresh();
}
$('#verBtn').onclick = () => openPanel('v');
$('#langBtn').onclick = () => openPanel('lang');
$('#srcBtn').onclick = () => openPanel('src');
$('#ldrBtn').onclick = () => openPanel('l');
$('#f').onsubmit = e => { e.preventDefault(); $('#q').blur(); refresh(); };
$('#q').oninput = () => { if (!$('#q').value.trim()) home(); };
function refresh(){ $('#q').value.trim() ? run() : home(); }

fetch('https://api.modrinth.com/v2/tag/game_version').then(r => r.json()).then(list => {
  S.versions = list.filter(v => v.version_type === 'release').map(v => v.version);
}).catch(() => {});

// ---------- home: popular mods ----------
function mrPopular(limit, offset){
  const facets = [['project_type:mod']];
  if (S.v) facets.push(['versions:' + S.v]);
  if (S.l) facets.push(['categories:' + S.l]);
  return fetch(`https://api.modrinth.com/v2/search?index=downloads&limit=${limit}&offset=${offset||0}&facets=${encodeURIComponent(JSON.stringify(facets))}`)
    .then(r => r.json()).then(d => d.hits.map(h => ({ src:'mr', id:h.project_id, title:h.title, author:h.author, desc:h.description, icon:h.icon_url, downloads:h.downloads })));
}
function mqHTML(m){ return `<div class="mq" data-src="${m.src}" data-id="${m.id}"><img src="${esc(m.icon)}" onerror="this.style.visibility='hidden'"><div><b>${esc(m.title)}</b><span>⬇️ ${fmt(m.downloads)}</span></div></div>`; }
async function home(){
  const R = $('#res');
  R.innerHTML = `<div class="sec">${t('trending')}</div><div class="skel" style="height:58px"></div><div class="skel" style="height:58px"></div><div class="sec">${t('popular')}</div>` + '<div class="skel"></div>'.repeat(4);
  try {
    const [a, b] = await Promise.all([mrPopular(30, 0), mrPopular(30, 30)]);
    if ($('#q').value.trim()) return;
    const row1 = a.slice(0, 15), row2 = a.slice(15, 30);
    R.innerHTML = `<div class="sec">${t('trending')}</div>
      <div class="marquee"><div class="track">${(row1.concat(row1)).map(mqHTML).join('')}</div></div>
      <div class="marquee"><div class="track rev">${(row2.concat(row2)).map(mqHTML).join('')}</div></div>
      <div class="sec">${t('popular')}</div>` + a.concat(b).map(cardHTML).join('');
    bindCards(R); translateCards(R);
  } catch (e) { R.innerHTML = `<div class="empty"><div>⚠️</div>${t('conn')}</div>`; }
}

// ---------- search ----------
function skeleton(el, n){ el.innerHTML = '<div class="skel"></div>'.repeat(n); }
function cardHTML(m){
  return `<div class="card" data-src="${m.src}" data-id="${m.id}">
    <img class="ico" src="${esc(m.icon)}" onerror="this.style.visibility='hidden'">
    <div class="meta"><div class="t"><span>${esc(m.title)}</span>${badge(m.src)}</div>
    <div class="a">👤 ${esc(m.author)} · ⬇️ ${fmt(m.downloads)}</div><div class="d" data-o="${esc(m.desc)}">${esc(m.desc)}</div></div></div>`;
}
async function run(){
  const q = $('#q').value.trim(); if (!q) return home();
  const R = $('#res'); skeleton(R, 6);
  try {
    const d = await api({ a:'search', q, v:S.v, l:S.l, src:S.src === 'all' ? '' : S.src });
    const list = d.results || [];
    if (!list.length) { R.innerHTML = `<div class="empty"><div>😕</div>${t('nothing')}</div>`; return; }
    R.innerHTML = (d.query && d.query.toLowerCase() !== q.toLowerCase() ? `<div class="info">${t('as')}: «${esc(d.query)}»</div>` : '') +
      `<div class="sec">${t('results')}</div>` + list.map(cardHTML).join('');
    bindCards(R); translateCards(R);
  } catch (e) { R.innerHTML = `<div class="empty"><div>⚠️</div>${t('conn')}</div>`; }
}
// ---------- AI search ideas ----------
function openAI(prefill){
  const b = $('#aiBox');
  if (b.classList.contains('open') && !prefill) { b.classList.remove('open'); return; }
  b.innerHTML = `<textarea id="aiText" rows="2" placeholder="${esc(t('aiPh'))}"></textarea><button class="btn" id="aiGo">${t('aiGo')}</button><div id="aiRes"></div>`;
  b.classList.add('open'); $('#aiGo').onclick = aiRun; haptic();
  if (prefill) showAI(prefill, ''); else $('#aiText').focus();
}
async function aiRun(){
  const txt = $('#aiText').value.trim(); if (!txt) return; haptic(); $('#aiText').blur();
  $('#aiRes').innerHTML = '<div class="skel" style="height:44px"></div>';
  try { const r = await api({ a:'ai', text: txt }); if (!r.queries || !r.queries.length) throw 0; showAI(r.queries, r.heard); }
  catch (e) { $('#aiRes').innerHTML = `<div class="info">${t('aiErr')}</div>`; }
}
function showAI(qs, heard){
  $('#aiRes').innerHTML = (heard ? `<div class="info">“${esc(heard)}”</div>` : '') + `<div class="info">${t('aiHint')}</div><div class="aichips">` +
    qs.map(q => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('') + `</div><button class="btn sec2" id="aiAll">${t('aiAll')}</button>`;
  $('#aiRes').querySelectorAll('[data-q]').forEach(c => c.onclick = () => { $('#q').value = c.dataset.q; haptic(); run(); });
  $('#aiAll').onclick = () => runMulti(qs);
}
async function runMulti(qs){
  const R = $('#res'); skeleton(R, 6); haptic();
  try {
    const all = await Promise.all(qs.map(q => api({ a:'search', q, v:S.v, l:S.l, src:S.src === 'all' ? '' : S.src }).catch(() => ({ results: [] }))));
    const seen = new Set(), list = [], n = Math.max(0, ...all.map(d => (d.results || []).length));
    for (let i = 0; i < n; i++) for (const d of all) { const m = (d.results || [])[i]; if (m && !seen.has(m.src + m.id)) { seen.add(m.src + m.id); list.push(m); } }
    if (!list.length) { R.innerHTML = `<div class="empty"><div>😕</div>${t('nothing')}</div>`; return; }
    R.innerHTML = `<div class="sec">${t('results')}</div>` + list.map(cardHTML).join(''); bindCards(R); translateCards(R);
  } catch (e) { R.innerHTML = `<div class="empty"><div>⚠️</div>${t('conn')}</div>`; }
}
$('#aiBtn').onclick = () => openAI();
function bindCards(root){ root.querySelectorAll('[data-id]').forEach(c => c.onclick = () => { haptic(); openMod(c.dataset.src, c.dataset.id); }); }

// ---------- detail ----------
async function openMod(src, id){
  window.scrollTo(0, 0); $('#list').style.display = 'none'; const D = $('#detail'); D.style.display = 'block';
  D.innerHTML = '<div class="skel" style="height:90px"></div><div class="skel"></div><div class="skel" style="height:200px"></div>';
  if (tg) { tg.BackButton.offClick(closeMod); tg.BackButton.show(); tg.BackButton.onClick(closeMod); }
  const p = await api({ a:'project', src, id }).catch(() => null);
  if (!p || p.error) { D.innerHTML = `<div class="empty"><div>⚠️</div>${t('failMod')}</div>`; return; }
  const bodyHTML = p.body ? DOMPurify.sanitize(src === 'mr' ? marked.parse(p.body) : p.body) : '';
  const [desc] = await translateTexts([p.desc || '']);
  const st = { body: bodyHTML, bodyTr: null, tr: S.lang !== 'en' };
  D.innerHTML = `
    <div class="hero"><img class="ico" src="${esc(p.icon)}" onerror="this.style.visibility='hidden'"><div>${badge(src)}<h2>${esc(p.title)}</h2><div class="a">👤 ${esc(p.author)}</div></div></div>
    <div class="stats"><div class="stat">⬇️ ${fmt(p.downloads)} ${t('dls')}</div>${(p.loaders||[]).map(l => `<div class="stat">${esc(l)}</div>`).join('')}</div>
    <div style="margin-bottom:14px" id="sdesc">${esc(desc)}</div>
    ${S.lang !== 'en' ? `<button class="btn sec2" id="trb">${bodyHTML ? t('tr') : t('orig')}</button>` : ''}
    <button class="btn" id="dlbtn">${t('dl')}${S.v ? t('dlFor') + esc(S.v) : ''}${S.l ? ' · ' + esc(S.l) : ''}</button>
    <button class="btn sec2" id="site">${t('site')}</button>
    <div id="files"></div>
    <h3>${t('similar')}</h3><div class="row" id="sim"><div class="skel" style="width:120px;height:150px;flex:none"></div><div class="skel" style="width:120px;height:150px;flex:none"></div></div>
    ${bodyHTML ? `<h3>${t('desc')}</h3><div class="body short" id="body">${bodyHTML}</div><button class="btn sec2" id="more" style="margin-top:8px">${t('more')}</button>` : ''}`;
  $('#site').onclick = () => openURL(p.url);
  $('#dlbtn').onclick = () => loadFiles(src, id, p.title);
  if ($('#more')) $('#more').onclick = () => { $('#body').classList.remove('short'); $('#more').remove(); };
  const showMode = () => {
    $('#sdesc').textContent = st.tr ? desc : (p.desc || '');
    if ($('#body')) { $('#body').innerHTML = st.tr && st.bodyTr ? st.bodyTr : st.body; bindBodyLinks(); }
    $('#trb').textContent = st.tr ? t('orig') : t('showTr');
  };
  if ($('#trb')) $('#trb').onclick = async () => {
    haptic();
    if (st.body && st.bodyTr === null) {            // first press: translate the full description
      $('#trb').textContent = '…';
      try { const r = await api({ a:'tr', to:S.lang, html:'1', text: st.body.slice(0, 3500) });
        st.bodyTr = r.text ? DOMPurify.sanitize(r.text) : st.body; } catch (e) { $('#trb').textContent = t('conn'); return; }
      st.tr = true; return showMode();
    }
    st.tr = !st.tr; showMode();
  };
  D.querySelector('.hero .ico').onclick = () => openLB(p.iconBig || p.icon);
  bindBodyLinks();
  api({ a:'similar', src, id, v:S.v, l:S.l }).then(list => {
    $('#sim').innerHTML = (list || []).length ? list.map(m => `<div class="sim" data-src="${m.src}" data-id="${m.id}"><img src="${esc(m.icon)}" onerror="this.style.visibility='hidden'"><b>${esc(m.title)}</b><span>⬇️ ${fmt(m.downloads)}</span></div>`).join('') : `<div class="info">${t('noSim')}</div>`;
    bindCards($('#sim'));
  }).catch(() => {});
}
function openLB(src){ if (!src) return; haptic(); $('#lbImg').src = src; $('#lb').classList.add('show');
  if (tg) { tg.BackButton.offClick(closeMod); tg.BackButton.onClick(closeLB); } }
function closeLB(){ $('#lb').classList.remove('show'); if (tg) { tg.BackButton.offClick(closeLB); tg.BackButton.onClick(closeMod); } }
$('#lbX').onclick = closeLB; $('#lb').onclick = e => { if (e.target.id === 'lb') closeLB(); };
function bindBodyLinks(){ document.querySelectorAll('#body a').forEach(a => a.onclick = e => { e.preventDefault(); openURL(a.href); }); }
async function loadFiles(src, id, title){
  const F = $('#files'); F.innerHTML = `<h3>${t('files')}</h3><div class="skel" style="height:56px"></div><div class="skel" style="height:56px"></div>`;
  const list = (await api({ a:'files', src, id, v:S.v, l:S.l }).catch(() => [])).slice(0, 15);
  if (!list.length) { F.innerHTML = `<h3>${t('files')}</h3><div class="info">${t('noFiles')}</div>`; return; }
  F.innerHTML = `<h3>${t('files')}</h3>` + list.map((f, i) => `<div class="file"><div class="fm"><div class="fn">${esc(f.name)}</div>
    <div class="fv">${esc((f.mc||[]).slice(0,4).join(', '))} · ${esc((f.loaders||[]).join('/'))} · ${((f.size||0)/1048576).toFixed(1)} MB</div></div>
    ${tg && tg.initData ? `<button class="mini" data-chat="${i}">${t('chat')}</button>` : ''}<button class="mini g" data-dl="${i}">⬇️</button></div>`).join('');
  F.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { const f = list[b.dataset.dl]; if (!f.url) return toast(t('forb')); openURL(f.url); });
  F.querySelectorAll('[data-chat]').forEach(b => b.onclick = async () => {
    const f = list[b.dataset.chat]; b.textContent = '…'; haptic();
    const r = await api({ a:'send', init:tg.initData, url:f.url, name:f.name, file:f.file, size:f.size, mc:(f.mc||[]).join(','), title }).catch(() => ({}));
    b.textContent = r.ok ? '✅' : '⚠️'; toast(r.ok ? t('sent') : t('fail'));
  });
  F.scrollIntoView({ behavior:'smooth' });
}
function closeMod(){ $('#detail').style.display = 'none'; $('#list').style.display = 'block'; if (tg) { tg.BackButton.hide(); tg.BackButton.offClick(closeMod); } }

applyTheme(); applyLang();
const aiParam = new URLSearchParams(location.search).get('ai');
if (aiParam) { const qs = aiParam.split('|').filter(Boolean); openAI(qs); runMulti(qs); } else home();
</script>
</body>
</html>
